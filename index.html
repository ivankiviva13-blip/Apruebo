border-radius:8px;background:#edf3f7;color:#466276;margin-right:9px;font-size:12px;font-weight:900}.answer:nth-child(1):before{content:"A"}.answer:nth-child(2):before{content:"B"}.answer:nth-child(3):before{content:"C"}.footnote{padding:8px 4px}

<script>
const DATA_URL='curriculum.json';let data,tab='home',lang='es',view='home',currentTopic=1,quizList=[],quizIndex=0,answered=false,wrongIds=[],lastAnswers={},state={xp:0,done:[],mistakes:[],streak:0,lastDay:''};
const icons=['🚘','🪪','🧠','🚶','🦺','🛞','💡','🚦','🛣️','⏱️','↪️','⚖️','🧳','👀','🔧','🚑','🍃','⭐'];
const readState=()=>{try{let s=JSON.parse(localStorage.getItem('permisoBState')||'{}');state={...state,...s}}catch(e){}};const save=()=>{localStorage.setItem('permisoBState',JSON.stringify(state));document.getElementById('xp').textContent=state.xp};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('xp').textContent=state.xp;let a=document.getElementById('app');if(view==='lesson')return renderLesson(a);if(view==='quiz')return renderQuiz(a);if(view==='result')return renderResult(a);if(tab==='home')return renderHome(a);if(tab==='practice')return renderPractice(a);if(tab==='mistakes')return renderMistakes(a);return renderProfile(a)}
function renderHome(a){let done=state.done.length;let topics=data.topics; a.innerHTML=`<section class="welcome"><h1>¡Vamos a por el permiso B! 🚦</h1><p>Aprende un poco cada día. Lecciones cortas, preguntas y progreso a tu ritmo.</p><div class="row"><button class="pill primary" onclick="openLesson(${topics.find(t=>!state.done.includes(t.id))?.id||1})">▶ Continuar</button><button class="pill white" onclick="startQuiz('all')">Test rápido</button></div></section><section class="alert"><b>⚠️ Actualización normativa</b>Este curso parte del manual DGT en Lectura Fácil, edición corregida de octubre de 2024. La normativa ha cambiado después: la reforma del Reglamento General de Circulación entró en vigor el 1 de octubre de 2026. Los temas afectados están marcados para revisión; contrasta siempre los cambios con la DGT.<br><a class="link" href="https://www.dgt.es/comunicacion/notas-de-prensa/20260930-reforma-del-reglamento-de-circulacion-usuarios-vulnerables/" target="_blank" rel="noreferrer">Leer aviso oficial DGT ↗</a></section><section class="panel"><h3>🆕 Cambios oficiales que debes revisar (2026)</h3><p class="lesson-summary">La reforma del Reglamento General de Circulación está vigente desde el 1 de octubre de 2026. Para quien prepara el permiso B, presta especial atención a estas novedades:</p><ul style="padding-left:20px;line-height:1.55;font-size:14px"><li>Al adelantar bicicletas en vías interurbanas: reducir al menos 20 km/h respecto al límite, dejar 1,5 m de separación lateral y cambiar completamente de carril cuando haya más de un carril por sentido.</li><li>En vías urbanas, mantener una distancia mínima de 5 m respecto a ciclistas que circulen delante por el mismo carril.</li><li>En retenciones con vehículos detenidos o a paso de peatón, crear un carril de emergencia: en vías de dos carriles, dejar libre el centro; en vías de tres, abrir espacio entre el carril izquierdo y el central.</li><li>Si la nieve dificulta la circulación en autopistas o autovías, no adelantar y dejar libre el carril izquierdo para emergencias y quitanieves.</li><li>Al rebasar vehículos inmovilizados por accidente, avería u otros trabajos, dejar 1,5 m de separación lateral y reducir al menos 20 km/h respecto al límite.</li></ul><p class="small">Resumen inicial de la nota oficial DGT; comprueba el texto normativo completo antes del examen. <a class="link" href="https://www.dgt.es/comunicacion/notas-de-prensa/20260930-reforma-del-reglamento-de-circulacion-usuarios-vulnerables/" target="_blank" rel="noreferrer">Fuente DGT ↗</a></p></section><section class="progressbox"><div class="row" style="justify-content:space-between"><b>Tu camino de aprendizaje</b><span class="small">${done}/18 unidades</span></div><div class="bar"><span style="width:${done/18*100}%"></span></div></section><div class="sectionhead"><h2>Tu ruta de aprendizaje</h2><span class="small">18 unidades</span></div>${topics.map(t=>`<div class="topic" onclick="openLesson(${t.id})"><div class="badgeicon">${icons[t.id-1]}</div><div style="flex:1"><h3>${t.id===18?'Anexo · ':`Tema ${t.id} · `}${esc(t.title)}</h3><p>${esc(t.subtitle)}</p></div><div class="topicmeta">${state.done.includes(t.id)?'<strong>✓</strong>Hecho':`<strong>${t.id===18?'Bonus':'+'+(t.id*2)}</strong>XP`}</div></div>`).join('')}<p class="footnote">Contenido didáctico resumido a partir del PDF aportado. No sustituye el manual oficial ni garantiza que cada detalle refleje la última reforma.</p>`}
function openLesson(id){currentTopic=id;view='lesson';tab='home';render()}
function renderLesson(a){let t=data.topics.find(x=>x.id===currentTopic);let translation=lang==='uk'?`<div class="translate"><b>🇺🇦 Український переклад</b><br>${esc(t.summaryUk)}</div>`:'';let detailed=(t.lessons||[]).map((l,i)=>`<div class="panel"><span class="tag">Lección ${i+1} de ${(t.lessons||[]).length}</span><h3>${esc(lang==='uk'?l.titleUk:l.title)}</h3><p class="lesson-summary">${esc(lang==='uk'?l.textUk:l.textEs)}</p><div class="rulebox"><b>📌 ${lang==='uk'?'Запам’ятай':'Recuerda'}</b><br>${esc(lang==='uk'?l.rememberUk:l.rememberEs)}</div></div>`).join('');let sourceNote=t.id===1?`<div class="alert"><b>Fuente y actualización</b>Contenido basado en el Tema 1 del PDF DGT/ETRASA, edición corregida octubre de 2024, páginas impresas 5–25. Las definiciones legales y requisitos que puedan haber cambiado deben verificarse con la DGT antes del examen. La actualización sobre VMP se muestra separada del texto del manual.</div>`:t.id===3?`<div class="alert"><b>Fuente y actualización</b>Lecciones basadas en el Tema 3 del manual aportado, páginas 42–66. Los límites de alcohol y recomendaciones de descanso se contrastan por separado con la DGT y pueden actualizarse; prevalece la normativa vigente.</div><div class="small"><a class="link" href="https://www.dgt.es/muevete-con-seguridad/evita-conductas-de-riesgo/consumo-de-alcohol/" target="_blank" rel="noreferrer">DGT · Alcohol ↗</a> · <a class="link" href="https://www.dgt.es/muevete-con-seguridad/evita-conductas-de-riesgo/Conducir-con-sueno-o-cansancio" target="_blank" rel="noreferrer">DGT · Sueño y cansancio ↗</a> · <a class="link" href="https://www.dgt.es/muevete-con-seguridad/evita-conductas-de-riesgo/consumo-de-drogas-y-medicacion/" target="_blank" rel="noreferrer">DGT · Drogas y medicación ↗</a></div>`:'';a.innerHTML=`<button class="back" onclick="view='home';tab='home';render()">← Volver al camino</button><div class="panel"><span class="tag">${t.id===18?'Anexo':'Tema '+t.id} · Lectura y comprensión</span><h1 class="lesson-title">${esc(t.title)}</h1><div class="small">${esc(t.subtitle)}</div><p class="lesson-summary">${esc(t.summaryEs)}</p>${t.id===3?`<div class="driver-visual"><div class="driver-visual-title">🧠 Estado del conductor</div><div class="driver-flow"><div><b>👁️ Percepción</b><small>Ver y comprender la vía</small></div><span>→</span><div><b>⚡ Reacción</b><small>Responder a tiempo</small></div><span>→</span><div><b>🛞 Decisión</b><small>Actuar con seguridad</small></div></div><div class="risk-grid"><div><b>😴 Fatiga / sueño</b><small>Menos atención · reacción lenta</small></div><div><b>🍷 Alcohol / drogas</b><small>Percepción y coordinación alteradas</small></div><div><b>💊 Medicamentos</b><small>Somnolencia · mareos · visión borrosa</small></div><div><b>📱 Distracciones</b><small>La vista y la mente se apartan de la vía</small></div></div><div class="stop-rule"><b>🛑 Regla práctica</b><br>Si notas sueño, fatiga o efectos de sustancias: no sigas conduciendo. Detente en un lugar seguro.</div></div>`:''}${t.id===2?`<div class="split-visual"><div><div style="font-size:23px">🧑‍✈️</div><strong>Documentos del conductor</strong><span>Permiso de conducir</span></div><div><div style="font-size:23px">🚘</div><strong>Documentos del vehículo</strong><span>Permiso de circulación · Tarjeta ITV · Seguro</span></div></div><div class="visual-grid"><div class="doc-card"><div class="doc-icon">🪪</div><b>Permiso de conducir</b><small>Identifica al conductor autorizado</small></div><div class="doc-card"><div class="doc-icon">🚗</div><b>Permiso de circulación</b><small>Identifica el vehículo matriculado</small></div><div class="doc-card"><div class="doc-icon">🔧</div><b>Tarjeta ITV</b><small>Datos técnicos e inspecciones</small></div><div class="doc-card"><div class="doc-icon">🛡️</div><b>Seguro obligatorio</b><small>Responsabilidad civil frente a terceros</small></div></div><div class="rulebox"><b>Regla visual</b><br>Persona → permiso de conducir. Vehículo → circulación + ITV. Daños a terceros → seguro.</div>`:''}${translation}<div class="row"><button class="pill soft" onclick="lang=lang==='uk'?'es':'uk';render()">${lang==='uk'?'🇪🇸 Ocultar traducción':'🇺🇦 Traducir al ucraniano'}</button><button class="pill white" onclick="startQuiz(${t.id})">Hacer preguntas →</button></div><div style="margin-top:16px"><h3>📚 Contenido de esta unidad</h3><ul style="padding-left:20px;line-height:1.65;font-size:14px">${t.outline.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>${detailed}${sourceNote}<div class="panel"><h3>🎯 Lo que debes recordar</h3><p class="lesson-summary">${esc(t.summaryEs)}</p><div class="rulebox">📌 <b>Consejo:</b> intenta explicar esta regla con tus propias palabras antes de pasar a la pregunta.</div>${t.id===8?'<p class="small">Jerarquía básica recogida en el manual: agentes → señalización circunstancial → semáforos → señales verticales → marcas viales. Comprueba siempre el contexto y la norma vigente.</p>':''}${t.id===18?'<p class="small">Los puntos y sanciones pueden variar por cambios legales. Esta unidad no pretende fijar cifras actuales: consulta la DGT antes del examen.</p>':''}${[3,4,5,8,9,10,11,12,13,14,16].includes(t.id)?'<div class="alert"><b>Actualización pendiente de comprobación</b>Este tema puede verse afectado por cambios normativos recientes. Se mantiene separado el resumen del manual 2024 de las actualizaciones oficiales posteriores.</div>':''}</div>`}
function startQuiz(which){let qs=data.questions;if(which!=='all')qs=qs.filter(q=>q.topic===Number(which));else qs=[...qs].sort(()=>Math.random()-.5).slice(0,10);quizList=qs.map(q=>({...q,options:[...q.options],_key:q.topic}));quizIndex=0;answered=false;wrongIds=[];view='quiz';tab='practice';render()}
function renderQuiz(a){if(quizIndex>=quizList.length){view='result';return renderResult(a)}let q=quizList[quizIndex];let t=data.topics.find(t=>t.id===q.topic);a.innerHTML=`<button class="back" onclick="view='home';tab='home';render()">✕ Salir del test</button><div class="quiz-head"><span class="tag">${q.topic===18?'Anexo':'Tema '+q.topic}</span><span class="quiz-count">PREGUNTA ${quizIndex+1} / ${quizList.length}</span></div><div class="bar"><span style="width:${(quizIndex)/quizList.length*100}%"></span></div><section class="quiz-card"><div class="quiz-kicker">${esc(t.title)} · Permiso B</div><div class="question">${esc(q.question)}</div><div id="answers">${q.options.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})">${esc(o)}</button>`).join('')}</div><div id="feedback"></div><button id="next" class="pill primary hidden" style="width:100%;margin-top:10px" onclick="nextQuestion()">${quizIndex===quizList.length-1?'Ver resultado':'Siguiente pregunta →'}</button></section>`}
function answer(i){if(answered)return;answered=true;let q=quizList[quizIndex],correct=i===q.correct;document.querySelectorAll('.answer').forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('correct');if(n===i&&!correct)b.classList.add('wrong')});let msg=lang==='uk'?q.explanationUk:q.explanationEs;document.getElementById('feedback').innerHTML=`<div class="feedback ${correct?'good':'bad'}"><b>${correct?'¡Muy bien! +5 XP':'No exactamente'}</b><br>${esc(msg)}${lang==='es'?`<div style="margin-top:7px"><button class="pill white" onclick="showQTranslation()">🇺🇦 Перекласти</button></div><div id="qtranslation"></div>`:''}</div>`;if(correct)state.xp+=5;else{wrongIds.push(q.topic);if(!state.mistakes.includes(q.topic))state.mistakes.push(q.topic)}state.lastDay=new Date().toISOString().slice(0,10);save();document.getElementById('next').classList.remove('hidden')}
function showQTranslation(){let q=quizList[quizIndex];document.getElementById('qtranslation').textContent=q.explanationUk}
function nextQuestion(){quizIndex++;answered=false;if(quizIndex>=quizList.length){let ids=[...new Set(quizList.map(q=>q.topic))];ids.forEach(id=>{if(!wrongIds.includes(id)&&!state.done.includes(id))state.done.push(id)});if(wrongIds.length===0)state.xp+=10;save();view='result';render()}else render()}
function renderResult(a){let total=quizList.length,correct=total-wrongIds.length; a.innerHTML=`<div class="panel" style="text-align:center;padding:28px 18px"><div style="font-size:56px">${correct===total?'🏆':'🚦'}</div><h1 class="lesson-title">${correct===total?'¡Perfecto!':'¡Buen trabajo!'}</h1><p class="lesson-summary">Has respondido correctamente ${correct} de ${total} preguntas.</p><div class="stats"><div class="stat"><strong>${Math.round(correct/Math.max(total,1)*100)}%</strong><span>Aciertos</span></div><div class="stat"><strong>+${correct*5+(wrongIds.length===0?10:0)}</strong><span>XP posibles</span></div><div class="stat"><strong>${new Set(wrongIds).size}</strong><span>Temas a repasar</span></div></div><div style="margin-top:20px" class="row"><button class="pill primary" onclick="view='home';tab='home';render()">Volver al camino</button><button class="pill white" onclick="startQuiz('all')">Otro test</button></div></div>${wrongIds.length?`<div class="panel"><h3>❤️ Repasa estos temas</h3>${[...new Set(wrongIds)].map(id=>`<div class="topic" onclick="openLesson(${id})"><div class="badgeicon">${icons[id-1]}</div><div><h3>Tema ${id} · ${esc(data.topics.find(t=>t.id===id).title)}</h3><p>Vuelve a estudiar y prueba otra vez.</p></div></div>`).join('')}</div>`:''}`}
function renderPractice(a){a.innerHTML=`<div class="sectionhead"><h2>Zona de práctica 🎯</h2></div><div class="panel"><h3>Test mixto</h3><p>10 preguntas de distintas unidades para comprobar qué recuerdas.</p><button class="pill primary" onclick="startQuiz('all')">Empezar test de 10 preguntas</button></div><div class="panel"><h3>Entrenar por tema</h3><p>Elige una unidad y responde su pregunta de práctica.</p>${data.topics.map(t=>`<button class="answer" onclick="startQuiz(${t.id})">${icons[t.id-1]} ${t.id===18?'Anexo':`Tema ${t.id}`} · ${esc(t.title)} →</button>`).join('')}</div><div class="alert"><b>Formato de práctica</b>Preguntas originales redactadas con el estilo de los test de la DGT: situación concreta, tres respuestas y una sola correcta. No se presentan como preguntas oficiales ni como preguntas filtradas. Puedes practicar también en los <a class="link" href="https://www.dgt.es/nuestros-servicios/permisos-de-conducir/obtener-un-nuevo-permiso-de-conducir/requisitos-preparacion-y-presentacion-a-examen/" target="_blank" rel="noreferrer">test gratuitos de la DGT ↗</a>.</div>`}
function renderMistakes(a){let ids=state.mistakes;a.innerHTML=`<div class="sectionhead"><h2>Repetir y mejorar ❤️</h2></div><div class="panel"><p>Los temas donde fallaste se guardan en este dispositivo.</p>${ids.length?ids.map(id=>`<div class="topic" onclick="openLesson(${id})"><div class="badgeicon">${icons[id-1]}</div><div style="flex:1"><h3>${esc(data.topics.find(t=>t.id===id).title)}</h3><p>Releer el resumen y volver a practicar.</p></div><button class="pill soft" onclick="event.stopPropagation();startQuiz(${id})">Practicar</button></div>`).join(''):'<div class="empty"><div style="font-size:38px">🌱</div><b>Aún no hay errores guardados</b><p>Cuando falles una pregunta, aquí aparecerá el tema para repasarlo.</p></div>'}<button class="pill white" onclick="state.mistakes=[];save();render()">Limpiar lista</button></div>`}
function renderProfile(a){a.innerHTML=`<div class="sectionhead"><h2>Tu progreso 🏆</h2></div><div class="panel"><div class="stats"><div class="stat"><strong>${state.xp}</strong><span>XP acumulados</span></div><div class="stat"><strong>${state.done.length}/18</strong><span>Unidades hechas</span></div><div class="stat"><strong>${state.mistakes.length}</strong><span>Temas por repasar</span></div></div><div class="sectionhead"><h2>Completitud del temario</h2></div><div class="bar"><span style="width:${state.done.length/18*100}%"></span></div><p class="small">La unidad se marca como completada cuando terminas su test sin errores. Puedes repetir las lecciones cuando quieras.</p></div><div class="panel"><h3>📚 Fuentes y estado del contenido</h3><p><b>Base:</b> Manual del Permiso B en Lectura Fácil, DGT / ETRASA, edición corregida octubre de 2024 (PDF aportado).</p><p><b>Actualización externa identificada:</b> reforma del Reglamento General de Circulación, Real Decreto 518/2026, con entrada en vigor indicada por la DGT para el 1 de octubre de 2026.</p><p><b>Estado:</b> Tema 1 ampliado con 9 lecciones detalladas y 10 preguntas de práctica. Las otras unidades mantienen contenido introductorio y todavía deben ampliarse desde el PDF. No es aún una transcripción completa de los 476 folios ni un banco oficial de preguntas.</p><p><a class="link" href="https://www.dgt.es/nuestros-servicios/permisos-de-conducir/obtener-un-nuevo-permiso-de-conducir/requisitos-preparacion-y-presentacion-a-examen/" target="_blank" rel="noreferrer">Tests oficiales gratuitos DGT ↗</a></p><p><a class="link" href="https://www.dgt.es/comunicacion/notas-de-prensa/20260930-reforma-del-reglamento-de-circulacion-usuarios-vulnerables/" target="_blank" rel="noreferrer">Reforma 2026: comunicado oficial ↗</a></p></div><div class="panel"><h3>⚙️ Datos locales</h3><p>El progreso se guarda en este navegador de este dispositivo. No hay cuenta ni sincronización entre dispositivos en esta versión.</p><button class="pill white" onclick="if(confirm('¿Borrar todo el progreso guardado?')){state={xp:0,done:[],mistakes:[],streak:0,lastDay:''};save();render()}">Restablecer progreso</button></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;view='home';render()}));
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
fetch(DATA_URL).then(r=>r.json()).then(d=>{data=d;readState();render()}).catch(()=>{document.getElementById('app').innerHTML='<div class="panel"><h2>No se pudo cargar el temario</h2><p>Asegúrate de abrir la aplicación desde su carpeta o desde un servidor web, no directamente como archivo.</p></div>'});
</script></main></body></html>
